# Generated by scripts/gen_compose.py  (3 DataNodes, replication factor 2)
x-app: &app                        # every service uses the same image, built from this directory
  build: .
  image: mini-hdfs:latest

x-common-env: &common-env
  NAMENODE_HOST: namenode
  NAMENODE_PORT: "5000"
  # CLUSTER_TOKEN: change-me     # uncomment (on EVERY service) to require a shared secret

services:
  namenode:
    <<: *app
    command: ["python", "namenode.py"]
    environment:
      <<: *common-env
      NAMENODE_DATA_DIR: /data
      REPLICATION_FACTOR: "2"
    volumes:
      - namenode-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 5000), 2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  client:
    <<: *app
    command: ["python", "client.py"]
    environment:
      <<: *common-env
      CLIENT_PORT: "8000"
    ports:
      - "8000:8000"          # the only port published to the host
    depends_on:
      namenode:
        condition: service_healthy
    restart: unless-stopped

  datanode0:
    <<: *app
    command: ["python", "datanode.py"]
    environment:
      <<: *common-env
      DATANODE_ID: datanode0
      DATANODE_PORT: "6000"
      DATA_DIR: /data
    volumes:
      - datanode0-data:/data
    depends_on:
      namenode:
        condition: service_healthy
    restart: unless-stopped

  datanode1:
    <<: *app
    command: ["python", "datanode.py"]
    environment:
      <<: *common-env
      DATANODE_ID: datanode1
      DATANODE_PORT: "6000"
      DATA_DIR: /data
    volumes:
      - datanode1-data:/data
    depends_on:
      namenode:
        condition: service_healthy
    restart: unless-stopped

  datanode2:
    <<: *app
    command: ["python", "datanode.py"]
    environment:
      <<: *common-env
      DATANODE_ID: datanode2
      DATANODE_PORT: "6000"
      DATA_DIR: /data
    volumes:
      - datanode2-data:/data
    depends_on:
      namenode:
        condition: service_healthy
    restart: unless-stopped

volumes:
  namenode-data:
  datanode0-data:
  datanode1-data:
  datanode2-data:
